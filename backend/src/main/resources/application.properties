# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:13306/bigdata_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 日志配置
logging.level.root=INFO
logging.level.com.bigdataai=DEBUG
logging.file.name=logs/bigdataai.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 异常处理配置
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# 服务器配置
server.port=8080
server.servlet.context-path=/
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20

# Redis配置
spring.redis.host=localhost
spring.redis.port=6379

# MongoDB配置
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=bigdata_db

# Spark配置 - 暂时禁用
spark.enabled=false

# Hadoop配置
hadoop.fs.defaultFS=hdfs://localhost:9000
hadoop.yarn.resourcemanager.address=localhost:8032
hadoop.yarn.resourcemanager.scheduler.address=localhost:8030
hadoop.mapreduce.framework.name=yarn
hadoop.user=bigdata

# HBase配置
hbase.zookeeper.quorum=localhost
hbase.zookeeper.property.clientPort=2181
hbase.rootdir=hdfs://localhost:9000/hbase

# Elasticsearch配置
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.cluster.name=elasticsearch

# Eureka配置 - 禁用服务发现
eureka.client.enabled=false
spring.cloud.discovery.enabled=false